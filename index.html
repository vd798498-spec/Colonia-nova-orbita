<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Colônia Estelar Nova Órbita</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK (modo compatível com arquivo único) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --space-bg: #070B19;
      --space-shell: #0F172A;
      --ink-dark: #090D16;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: #050811;
      background-image:
        radial-gradient(circle at 20% 25%, rgba(168, 85, 247, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(56, 189, 248, 0.14) 0%, transparent 45%);
      color: #F8FAFC;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    h1, h2, h3, .font-display {
      font-family: 'Fredoka', sans-serif;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      background-color: var(--space-shell);
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.7);
      overflow-x: hidden;
    }

    @media (min-width: 480px) {
      .app-shell {
        margin: 12px 0;
        min-height: calc(100vh - 24px);
        border-radius: 34px;
        border: 3px solid #334155;
        overflow: hidden;
      }
    }

    .btn-cosmic {
      border: 2.5px solid #090D16;
      box-shadow: 0 4px 0 #090D16;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }
    .btn-cosmic:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #090D16;
    }

    .btn-cosmic-sm {
      border: 2px solid #090D16;
      box-shadow: 0 3px 0 #090D16;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }
    .btn-cosmic-sm:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #090D16;
    }

    .colony-logo-text {
      color: #A3E635;
      text-shadow:
        -2px -2px 0 #090D16,
         2px -2px 0 #090D16,
        -2px  2px 0 #090D16,
         2px  2px 0 #090D16,
         0px 4px 0 #090D16;
    }

    .orbit-card {
      background: #F8FAFC;
      color: #0F172A;
      border-radius: 24px;
      border: 2.5px solid #090D16;
      box-shadow: 0 4px 0 rgba(9, 13, 22, 0.55);
    }

    @keyframes floatAlien {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float {
      animation: floatAlien 3.2s ease-in-out infinite;
    }

    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .tab-content {
      animation: popIn 0.2s ease-out;
    }

    #toast-container {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 120;
      width: 90%;
      max-width: 380px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-btn { color: #64748B; }
    .nav-btn.active {
      color: #A3E635;
      background: rgba(132, 204, 22, 0.12);
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <div id="toast-container"></div>

    <!-- TELA INICIAL DE ACESSO -->
    <section id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#050811]/95 backdrop-blur-md">
      <div class="w-full max-w-[380px] bg-[#0F172A] border-[3px] border-[#334155] rounded-3xl p-5 shadow-2xl">
        <div class="text-center mb-4">
          <div class="inline-block px-3 py-1 rounded-full bg-[#1E1B4B] border border-[#84CC16] text-[#A3E635] text-[11px] font-black uppercase tracking-wider mb-2">
            Acesso da Colônia
          </div>
          <h1 class="colony-logo-text font-display text-2xl font-bold leading-tight">
            Colônia Nova Órbita
          </h1>
          <p class="text-slate-300 text-xs mt-1 font-semibold">
            Entre com seu @ do TikTok e seu PIN único de até 4 dígitos.
          </p>
        </div>

        <div class="space-y-3">
          <div>
            <label for="login-tiktok" class="block text-xs font-black text-slate-200 mb-1">
              Coloque seu @ do TikTok:
            </label>
            <input
              id="login-tiktok"
              type="text"
              maxlength="30"
              placeholder="Coloque seu @ do TikTok"
              onkeydown="if (event.key === 'Enter') { event.preventDefault(); handleLoginClick(); }"
              class="w-full px-3.5 py-2.5 rounded-2xl bg-[#1E293B] text-white border-2 border-[#334155] focus:border-[#A3E635] focus:outline-none text-sm font-bold"
            />
          </div>

          <div>
            <label for="login-pin" class="block text-xs font-black text-slate-200 mb-1">
              PIN único (até 4 dígitos):
            </label>
            <input
              id="login-pin"
              type="password"
              inputmode="numeric"
              maxlength="4"
              placeholder="0000"
              oninput="this.value = this.value.replace(/\D/g, '').slice(0, 4)"
              onkeydown="if (event.key === 'Enter') { event.preventDefault(); handleLoginClick(); }"
              class="w-full px-3.5 py-2.5 rounded-2xl bg-[#1E293B] text-white border-2 border-[#334155] focus:border-[#38BDF8] focus:outline-none text-sm font-black tracking-widest"
            />
          </div>

          <p id="login-error" class="hidden text-xs font-extrabold text-rose-400 bg-rose-950/60 border border-rose-500/40 rounded-xl px-3 py-2"></p>

          <button type="button" id="login-submit-btn" onclick="handleLoginClick()" class="btn-cosmic w-full py-3 rounded-2xl bg-[#84CC16] text-[#090D16] text-sm font-black mt-1">
            Entrar na Conta
          </button>
        </div>
      </div>
    </section>

    <!-- CABEÇALHO SUPERIOR -->
    <header class="sticky top-0 z-40 bg-[#0B1120]/95 backdrop-blur-md border-b-2 border-[#1E293B] px-3.5 py-2.5 flex items-center justify-between gap-2">
      <button type="button" onclick="switchTab('inicio')" aria-label="Início" class="w-10 h-10 rounded-xl bg-[#1E1B4B] p-1.5 flex items-center justify-center shrink-0 border-2 border-[#84CC16] shadow-sm active:scale-95 transition">
        <svg viewBox="0 0 36 36" class="w-full h-full">
          <circle cx="18" cy="18" r="14" fill="#312E81"/>
          <circle cx="18" cy="18" r="8" fill="#84CC16"/>
          <ellipse cx="18" cy="18" rx="16" ry="5" fill="none" stroke="#FACC15" stroke-width="2.4" transform="rotate(-22 18 18)"/>
        </svg>
      </button>

      <div class="flex items-center gap-1.5">
        <span class="px-2.5 py-1 rounded-full bg-[#1E293B] border border-[#334155] text-[11px] font-black text-slate-200">
          Dia <span id="header-day">1</span>
        </span>
        <button type="button" onclick="openAccountSwitcher()" class="btn-cosmic-sm px-2.5 py-1.5 rounded-full text-[11px] bg-[#1E293B] text-slate-100">
          Trocar conta
        </button>
      </div>

      <button type="button" onclick="switchTab('passe')" class="bg-[#1E293B] text-white px-3 py-1.5 rounded-full flex items-center gap-1.5 text-xs font-extrabold border-2 border-[#38BDF8] shadow-sm active:scale-95 transition max-w-[165px]">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
          <polygon points="12,2 15,9 22,9.5 16.5,14.2 18.2,21 12,17.3 5.8,21 7.5,14.2 2,9.5 9,9" fill="#FACC15" stroke="#854D0E" stroke-width="1.5"/>
        </svg>
        <span id="header-stars" class="text-[#FACC15] font-black">0</span>
        <span class="text-slate-500">•</span>
        <span id="header-colonists" class="text-[#A3E635] font-black">0</span>
        <span class="text-[10px] text-slate-300">col.</span>
      </button>
    </header>

    <!-- BARRA SUPERIOR DE NAVEGAÇÃO -->
    <nav class="sticky top-[62px] w-full bg-[#0B1120]/95 backdrop-blur-md border-b-2 border-[#1E293B] px-1 py-1.5 z-30 grid grid-cols-7 gap-0.5">
      <button type="button" onclick="switchTab('inicio')" data-tab="inicio" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl transition">
        <span class="text-[9px] font-extrabold">Início</span>
      </button>
      <button type="button" onclick="switchTab('loja')" data-tab="loja" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl transition">
        <span class="text-[9px] font-extrabold">Loja</span>
      </button>
      <button type="button" onclick="switchTab('missoes')" data-tab="missoes" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl transition">
        <span class="text-[9px] font-extrabold">Missões</span>
      </button>
      <button type="button" onclick="switchTab('codigos')" data-tab="codigos" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl transition">
        <span class="text-[9px] font-extrabold">Códigos</span>
      </button>
      <button type="button" onclick="switchTab('passe')" data-tab="passe" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl transition">
        <span class="text-[9px] font-extrabold">Passe</span>
      </button>
      <button type="button" onclick="switchTab('mapa')" data-tab="mapa" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl transition">
        <span class="text-[9px] font-extrabold">Mapa</span>
      </button>
      <button type="button" onclick="switchTab('avisos')" data-tab="avisos" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl transition relative">
        <span class="text-[9px] font-extrabold">Avisos</span>
        <span id="nav-avisos-badge" class="hidden text-[9px] font-black text-amber-300">•</span>
      </button>
    </nav>

    <!-- ÁREA PRINCIPAL -->
    <main id="app-main" class="flex-1 overflow-y-auto pb-6"></main>
  </div>

  <!-- MODAL PARA CARTEIRA / MOTIVO DE DELETAR CONTA -->
  <div id="wallet-modal" class="fixed inset-0 z-50 bg-black/75 hidden items-center justify-center p-4">
    <div id="wallet-modal-card" class="bg-[#F8FAFC] text-[#0F172A] border-[3px] border-[#090D16] rounded-3xl w-full max-w-[360px] p-5 shadow-2xl relative">
      <button type="button" onclick="closeWalletModal()" aria-label="Fechar" class="absolute top-3.5 right-3.5 w-8 h-8 rounded-full bg-white border-2 border-[#090D16] font-black text-xs flex items-center justify-center">
        X
      </button>
      <div id="wallet-modal-body"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBAUoRv8uIgdIkbv3rrjyluC1Zcx9ZhPRc",
      authDomain: "colonia-nova-orbita.firebaseapp.com",
      databaseURL: "https://colonia-nova-orbita-default-rtdb.firebaseio.com",
      projectId: "colonia-nova-orbita",
      storageBucket: "colonia-nova-orbita.firebasestorage.app",
      messagingSenderId: "801880506373",
      appId: "1:801880506373:web:fe80e1f95032c2801f1c6c"
    };

    let rtdb = null;
    try {
      if (firebaseConfig.databaseURL) {
        firebase.initializeApp(firebaseConfig);
        rtdb = firebase.database();
      }
    } catch (e) {
      rtdb = null;
    }

    const ACCOUNTS_STORAGE_KEY = 'nova_orbita_accounts_v8';
    const GLOBAL_STORAGE_KEY = 'nova_orbita_global_v8';
    const ACTIVE_ACCOUNT_KEY = 'nova_orbita_active_account_v8';
    const ADMIN_ACCESS_CODE = 'Yuragafa610';
    const ONE_HOUR_MS = 60 * 60 * 1000;
    const ONE_DAY_MS = 24 * 60 * 60 * 1000;
    const DAILY_STARS_REWARD = 15;
    const MISSION_STARS_REWARD = 18;

    const PROMO_CODES = [
      {
        code: 'alien aura',
        reward: 50,
        durationDays: 30,
        description: 'Ganha +50 moedas/estrelas e dura até 30 dias.'
      }
    ];

    const WEEK_DAYS = [
      { key: 'dom', label: 'Dom' },
      { key: 'seg', label: 'seg' },
      { key: 'ter', label: 'ter' },
      { key: 'qua', label: 'qua' },
      { key: 'qui', label: 'qui' },
      { key: 'sex', label: 'sex' },
      { key: 'sab', label: 'sab' }
    ];

    const PLANETS = ['Lua', 'Marte', 'Júpiter'];
    const PROFESSIONS = ['Morador', 'Jornalista', 'Vendedor', 'Vendedor de Naves', 'Explorador'];

    const MISSION_ROTATION = [
      { id: 'patrulha', label: 'Missão 1: Fazer patrulha', reward: MISSION_STARS_REWARD, btnColor: 'bg-[#FACC15]' },
      { id: 'varredura', label: 'Missão 2: Varredura orbital', reward: MISSION_STARS_REWARD, btnColor: 'bg-[#38BDF8]' }
    ];

    const SPECIES = [
      { id: 'creme', name: 'Creme Lunar', skin: '#DDD6B8', ear: '#C9C09B', eye: '#3B3522' },
      { id: 'verde', name: 'Verde Clássico', skin: '#A3E635', ear: '#65A30D', eye: '#14532D' },
      { id: 'azul', name: 'Azul Netuno', skin: '#7DD3FC', ear: '#0284C7', eye: '#0C4A6E' },
      { id: 'roxo', name: 'Roxo Cósmico', skin: '#D8B4FE', ear: '#9333EA', eye: '#3B0764' }
    ];

    const SUITS = [
      { id: 'cor_branca', name: 'Cor Branca', type: 'cor', price: 0, suit: '#E2E8F0', trim: '#94A3B8', tentacles: false },
      { id: 'cor_azul', name: 'Cor Azul', type: 'cor', price: 0, suit: '#38BDF8', trim: '#0284C7', tentacles: false },
      { id: 'cor_verde', name: 'Cor Verde', type: 'cor', price: 0, suit: '#84CC16', trim: '#4D7C0F', tentacles: false },
      { id: 'cor_roxa', name: 'Cor Roxa', type: 'cor', price: 0, suit: '#C084FC', trim: '#7E22CE', tentacles: false },
      { id: 'roupa_astronauta', name: 'Roupa de Astronauta', type: 'fantasia', price: 110, suit: '#F1F5F9', trim: '#38BDF8', tentacles: false, astronautHelmet: true },
      { id: 'terno_espacial', name: 'Terno Espacial', type: 'fantasia', price: 100, suit: '#1E293B', trim: '#FACC15', tentacles: false, suitTie: true },
      { id: 'fantasia_gato_alien', name: 'Fantasia de Gato Alienígena', type: 'fantasia', price: 90, suit: '#4ADE80', trim: '#FACC15', tentacles: false, catEars: true },
      { id: 'fantasia_tentaculos', name: 'Fantasia de Alien com Tentáculos', type: 'fantasia', price: 80, suit: '#A855F7', trim: '#FACC15', tentacles: true },
      { id: 'fantasia_comandante', name: 'Fantasia Comandante Solar', type: 'fantasia', price: 120, suit: '#F59E0B', trim: '#FEF08A', tentacles: false }
    ];

    const ACCESSORIES = [
      { id: 'nenhum', name: 'Sem acessório', price: 0 },
      { id: 'coroa_cristais', name: 'Coroa com Cristais Coloridos', price: 55 },
      { id: 'oculos', name: 'Óculos Espacial', price: 30 },
      { id: 'brincos', name: 'Brincos Estelares', price: 35 },
      { id: 'chapeu', name: 'Chapéu da Galáxia', price: 45 }
    ];

    const PETS = [
      { id: 'nenhum', name: 'Sem animal', price: 0, kind: 'none', fur: 'transparent', ear: 'transparent', eye: 'transparent' },
      { id: 'cachorro_alien', name: 'Cachorro Alien', price: 65, kind: 'dog', fur: '#A3E635', ear: '#65A30D', eye: '#090D16' },
      { id: 'mini_alien', name: 'Mini Alien', price: 60, kind: 'alien', fur: '#A3E635', ear: '#65A30D', eye: '#090D16' },
      { id: 'mini_nave', name: 'Mini nave alienígena', price: 70, kind: 'ship', fur: '#38BDF8', ear: '#A3E635', eye: '#FACC15' },
      { id: 'mini_gato_alien', name: 'Mini gato alienígena', price: 50, kind: 'cat', fur: '#A3E635', ear: '#65A30D', eye: '#090D16' },
      { id: 'mini_gato_nebula', name: 'Mini gato nebuloso', price: 80, kind: 'cat', fur: '#C084FC', ear: '#7E22CE', eye: '#090D16' }
    ];

    function getCurrentWeekDayKey() {
      const idx = new Date().getDay();
      return WEEK_DAYS[idx] ? WEEK_DAYS[idx].key : 'dom';
    }

    function normalizeHandle(raw) {
      const clean = String(raw || '').trim().replace(/\s+/g, '');
      if (!clean) return '';
      return clean.startsWith('@') ? clean : `@${clean}`;
    }

    function dbSafeKey(handle) {
      return normalizeHandle(handle).toLowerCase().replace(/[.#$\[\]\/]/g, '_');
    }

    function createDefaultAccountState(handle, pin) {
      return {
        handle,
        pin: String(pin).trim(),
        activeTab: 'inicio',
        stars: 0,
        lastDailyClaimDay: 0,
        claimedWeekDays: {},
        redeemedCodes: [],
        notifications: [],
        look: { species: 'creme', suit: 'cor_branca', accessory: 'nenhum', pet: 'nenhum' },
        ownedSuits: ['cor_branca', 'cor_azul', 'cor_verde', 'cor_roxa'],
        ownedAccessories: ['nenhum'],
        ownedPets: ['nenhum'],
        profile: {
          base: 'Base Alfa-01',
          planet: 'Lua',
          profession: 'Morador'
        },
        missionSlot: 0,
        missionCooldownUntil: 0
      };
    }

    function ensureAccountFields(acc) {
      if (!acc.look) acc.look = { species: 'creme', suit: 'cor_branca', accessory: 'nenhum', pet: 'nenhum' };
      if (!acc.look.suit) acc.look.suit = 'cor_branca';
      if (!acc.look.accessory) acc.look.accessory = 'nenhum';
      if (!acc.look.pet) acc.look.pet = 'nenhum';
      if (typeof acc.lastDailyClaimDay !== 'number') acc.lastDailyClaimDay = 0;
      if (!acc.claimedWeekDays || typeof acc.claimedWeekDays !== 'object') acc.claimedWeekDays = {};
      if (!Array.isArray(acc.redeemedCodes)) acc.redeemedCodes = [];
      if (!Array.isArray(acc.ownedSuits)) acc.ownedSuits = ['cor_branca', 'cor_azul', 'cor_verde', 'cor_roxa'];
      if (!Array.isArray(acc.ownedAccessories)) acc.ownedAccessories = ['nenhum'];
      if (!Array.isArray(acc.ownedPets)) acc.ownedPets = ['nenhum'];
      if (!Array.isArray(acc.notifications)) acc.notifications = [];
      if (!acc.profile) acc.profile = { base: 'Base Alfa-01', planet: 'Lua', profession: 'Morador' };
      if (!acc.profile.base) acc.profile.base = 'Base Alfa-01';
      if (!PLANETS.includes(acc.profile.planet)) acc.profile.planet = 'Lua';
      if (!PROFESSIONS.includes(acc.profile.profession)) acc.profile.profession = 'Morador';
      return acc;
    }

    let globalState = {
      day: 1,
      activeColonists: [],
      pendingFollowers: [],
      deletionReasons: [],
      codeCreatedAt: {}
    };

    function loadLocalAccounts() {
      try {
        const raw = localStorage.getItem(ACCOUNTS_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        if (!parsed['@gf_nhoto']) {
          parsed['@gf_nhoto'] = createDefaultAccountState('@gf_nhoto', '2013');
        }
        return parsed;
      } catch (e) {
        return { '@gf_nhoto': createDefaultAccountState('@gf_nhoto', '2013') };
      }
    }

    function loadLocalGlobal() {
      try {
        const raw = localStorage.getItem(GLOBAL_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            day: parsed.day || 1,
            activeColonists: Array.isArray(parsed.activeColonists) ? parsed.activeColonists : [],
            pendingFollowers: Array.isArray(parsed.pendingFollowers) ? parsed.pendingFollowers : [],
            deletionReasons: Array.isArray(parsed.deletionReasons) ? parsed.deletionReasons : [],
            codeCreatedAt: parsed.codeCreatedAt && typeof parsed.codeCreatedAt === 'object' ? parsed.codeCreatedAt : {}
          };
        }
      } catch (e) {}
      return { day: 1, activeColonists: [], pendingFollowers: [], deletionReasons: [], codeCreatedAt: {} };
    }

    let accounts = loadLocalAccounts();
    globalState = loadLocalGlobal();
    let activeKey = localStorage.getItem(ACTIVE_ACCOUNT_KEY) || null;
    let state = activeKey && accounts[activeKey] ? ensureAccountFields(accounts[activeKey]) : null;
    let adminUnlocked = false;
    let selectedMapPlanet = state ? state.profile.planet : 'Lua';

    if (rtdb) {
      rtdb.ref('colony_global').on('value', (snap) => {
        const val = snap.val();
        if (val) {
          globalState.day = val.day || 1;
          globalState.activeColonists = Array.isArray(val.activeColonists) ? val.activeColonists : [];
          globalState.pendingFollowers = Array.isArray(val.pendingFollowers) ? val.pendingFollowers : [];
          globalState.deletionReasons = Array.isArray(val.deletionReasons) ? val.deletionReasons : [];
          globalState.codeCreatedAt = val.codeCreatedAt && typeof val.codeCreatedAt === 'object' ? val.codeCreatedAt : {};
          localStorage.setItem(GLOBAL_STORAGE_KEY, JSON.stringify(globalState));
          if (state) renderApp();
        }
      });

      rtdb.ref('colony_accounts').on('value', (snap) => {
        const val = snap.val();
        if (val) {
          Object.keys(val).forEach(k => {
            const acc = ensureAccountFields(val[k]);
            accounts[acc.handle.toLowerCase()] = acc;
          });
          localStorage.setItem(ACCOUNTS_STORAGE_KEY, JSON.stringify(accounts));
          if (activeKey && accounts[activeKey]) {
            const currentTab = state ? state.activeTab : 'inicio';
            state = ensureAccountFields(accounts[activeKey]);
            state.activeTab = currentTab;
            renderApp();
          }
        }
      });
    }

    function saveGlobalState() {
      localStorage.setItem(GLOBAL_STORAGE_KEY, JSON.stringify(globalState));
      if (rtdb) {
        rtdb.ref('colony_global').set(globalState);
      }
    }

    function saveAccountToCloud(accObj) {
      const k = accObj.handle.toLowerCase();
      accounts[k] = ensureAccountFields(accObj);
      localStorage.setItem(ACCOUNTS_STORAGE_KEY, JSON.stringify(accounts));
      if (rtdb) {
        rtdb.ref('colony_accounts/' + dbSafeKey(accObj.handle)).set(accounts[k]);

    function syncColonistDirectory(accObj) {
      const lower = accObj.handle.toLowerCase();
      const idx = globalState.activeColonists.findIndex(
        c => normalizeHandle(c.handle).toLowerCase() === lower
      );
      if (idx !== -1) {
        globalState.activeColonists[idx].species = accObj.look.species || 'creme';
        globalState.activeColonists[idx].suit = accObj.look.suit || 'cor_branca';
        globalState.activeColonists[idx].planet = accObj.profile.planet || 'Lua';
        globalState.activeColonists[idx].base = accObj.profile.base || 'Base Alfa-01';
        saveGlobalState();
      }
    }

    function persistCurrentState() {
      if (!state || !activeKey) return;
      saveAccountToCloud(state);
      syncColonistDirectory(state);
      updateHeaderAndNav();
    }

    function registerColonistGlobally(accObj) {
      const lower = accObj.handle.toLowerCase();
      const existingIdx = globalState.activeColonists.findIndex(
        c => normalizeHandle(c.handle).toLowerCase() === lower
      );
      if (existingIdx === -1) {
        const num = globalState.activeColonists.length + 1;
        globalState.activeColonists.push({
          id: `col_${Date.now()}_${num}`,
          handle: accObj.handle,
          arrivedOnDay: globalState.day,
          species: accObj.look.species || 'creme',
          suit: accObj.look.suit || 'cor_branca',
          planet: accObj.profile.planet || 'Lua',
          base: accObj.profile.base || 'Base Alfa-01',
          dome: `B-${String(num).padStart(2, '0')}`
        });
        saveGlobalState();
      } else {
        syncColonistDirectory(accObj);
      }
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    async function handleLoginClick() {
      const handleInput = document.getElementById('login-tiktok');
      const pinInput = document.getElementById('login-pin');

      const handle = normalizeHandle(handleInput ? handleInput.value : '');
      const pin = String(pinInput ? pinInput.value : '').replace(/\D/g, '').slice(0, 4);

      if (!handle || handle === '@') {
        setLoginError('Coloque seu @ do TikTok para entrar.');
        return;
      }
      if (!/^\d{1,4}$/.test(pin)) {
        setLoginError('Digite um PIN numérico de 1 a 4 dígitos.');
        return;
      }

      const key = handle.toLowerCase();

      if (rtdb) {
        try {
          const snap = await rtdb.ref('colony_accounts/' + dbSafeKey(handle)).get();
          if (snap.exists()) {
            accounts[key] = ensureAccountFields(snap.val());
          }
        } catch (e) {}
      }

      if (accounts[key]) {
        if (String(accounts[key].pin) !== pin) {
          setLoginError(`PIN incorreto para ${handle}. Só quem sabe o PIN único dessa conta pode entrar.`);
          return;
        }
        state = ensureAccountFields(accounts[key]);
      } else {
        state = createDefaultAccountState(handle, pin);
        saveAccountToCloud(state);
      }

      state.activeTab = 'inicio';
      registerColonistGlobally(state);
      selectedMapPlanet = state.profile.planet || 'Lua';
      activeKey = key;
      localStorage.setItem(ACTIVE_ACCOUNT_KEY, activeKey);
      clearLoginError();
      document.getElementById('login-screen').classList.add('hidden');
      renderApp();
      showToast(`Conta ${state.handle} acessada! Bem-vindo ao Início.`);
    }

    function openAccountSwitcher() {
      document.getElementById('login-tiktok').value = state ? state.handle : '';
      document.getElementById('login-pin').value = '';
      clearLoginError();
      document.getElementById('login-screen').classList.remove('hidden');
    }

    function confirmDeleteWithReason() {
      if (!state || !activeKey) return;
      const reasonInput = document.getElementById('delete-reason-input');
      const reason = String(reasonInput ? reasonInput.value : '').trim();

      if (!reason) {
        showToast('Escreva por qual motivo você quer deletar.', 'bg-rose-950 text-rose-200 border-rose-400');
        return;
      }

      globalState.deletionReasons.unshift({
        id: `del_${Date.now()}`,
        handle: state.handle,
        reason,
        day: globalState.day
      });

      const myHandle = state.handle;
      const myPin = state.pin;

      delete accounts[activeKey];
      localStorage.setItem(ACCOUNTS_STORAGE_KEY, JSON.stringify(accounts));
      if (rtdb) {
        rtdb.ref('colony_accounts/' + dbSafeKey(myHandle)).remove();
      }

      globalState.activeColonists = globalState.activeColonists.filter(
        c => normalizeHandle(c.handle).toLowerCase() !== activeKey
      );
      saveGlobalState();
      closeWalletModal();

      localStorage.removeItem(ACTIVE_ACCOUNT_KEY);
      activeKey = null;
      state = null;
      adminUnlocked = false;

      document.getElementById('login-tiktok').value = myHandle;
      document.getElementById('login-pin').value = myPin;
      clearLoginError();
      document.getElementById('login-screen').classList.remove('hidden');
      showToast(`Motivo enviado e dados de ${myHandle} deletados.`);
    }

    function getPromoRemainingDays(promo) {
      const createdAt = globalState.codeCreatedAt && globalState.codeCreatedAt[promo.code];
      if (!createdAt) return promo.durationDays;
      const elapsedDays = Math.floor((Date.now() - createdAt) / ONE_DAY_MS);
      return Math.max(0, promo.durationDays - elapsedDays);
    }

    function redeemPromoCode() {
      if (!state) return;
      const input = document.getElementById('promo-code-input');
      const typed = String(input ? input.value : '').trim().toLowerCase();

      if (!typed) {
        showToast('Digite um código para resgatar.', 'bg-rose-950 text-rose-200 border-rose-400');
        return;
      }

      const promo = PROMO_CODES.find(c => c.code.toLowerCase() === typed);
      if (!promo) {
        showToast('Código inválido.', 'bg-rose-950 text-rose-200 border-rose-400');
        return;
      }

      if (!globalState.codeCreatedAt[promo.code]) {
        globalState.codeCreatedAt[promo.code] = Date.now();
        saveGlobalState();
      }

      const daysLeft = getPromoRemainingDays(promo);
      if (daysLeft <= 0) {
        showToast(`O código "${promo.code}" expirou após ${promo.durationDays} dias.`, 'bg-rose-950 text-rose-200 border-rose-400');
        return;
      }

      if (state.redeemedCodes.includes(promo.code)) {
        showToast(`Você já resgatou o código "${promo.code}" nesta conta.`);
        return;
      }

      state.redeemedCodes.push(promo.code);
      state.stars += promo.reward;
      persistCurrentState();
      if (input) input.value = '';
      renderApp();
      showToast(`Código "${promo.code}" resgatado! +${promo.reward} moedas/estrelas!`);
    }

    function claimDailyStars() {
      if (!state) return;
      if (state.lastDailyClaimDay === globalState.day) {
        showToast(`Você já pegou as +${DAILY_STARS_REWARD} estrelas de hoje (Dia ${globalState.day})!`);
        return;

      const todayKey = getCurrentWeekDayKey();
      state.lastDailyClaimDay = globalState.day;
      state.claimedWeekDays[todayKey] = true;
      state.stars += DAILY_STARS_REWARD;
      persistCurrentState();
      renderApp();
      showToast(`+${DAILY_STARS_REWARD} estrelas diárias resgatadas!`);
    }

    function syncMissionTimer(now = Date.now()) {
      if (!state) return;
      if (state.missionCooldownUntil && now >= state.missionCooldownUntil) {
        state.missionCooldownUntil = 0;
        state.missionSlot = (state.missionSlot + 1) % MISSION_ROTATION.length;
        persistCurrentState();
      }
    }

    function formatRemainingMs(ms) {
      const totalSec = Math.max(0, Math.ceil(ms / 1000));
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function claimTimedMission() {
      if (!state) return;
      const now = Date.now();
      syncMissionTimer(now);

      if (state.missionCooldownUntil && now < state.missionCooldownUntil) {
        showToast('Essa missão já foi concluída. Aguarde 1 hora!');
        return;
      }

      const currentMission = MISSION_ROTATION[state.missionSlot % MISSION_ROTATION.length];
      state.stars += currentMission.reward;
      state.missionCooldownUntil = now + ONE_HOUR_MS;
      persistCurrentState();
      renderApp();
      showToast(`+${currentMission.reward} estrelas! Próxima missão em 1 hora.`);
    }

    function advanceOneHourByAdmin() {
      if (!state || !adminUnlocked) return;
      state.missionCooldownUntil = 0;
      state.missionSlot = (state.missionSlot + 1) % MISSION_ROTATION.length;
      persistCurrentState();
      renderApp();
      showToast('1 hora avançada pelo criador!');

    async function sendWarningToHandle() {
      if (!state || !adminUnlocked) return;
      const handleInput = document.getElementById('warning-handle-input');
      const msgInput = document.getElementById('warning-message-input');

      const targetHandle = normalizeHandle(handleInput ? handleInput.value : '');
      const message = String(msgInput ? msgInput.value : '').trim();

      if (!targetHandle || targetHandle === '@') {
        showToast('Digite o @ da pessoa para mandar o aviso.', 'bg-rose-950 text-rose-200 border-rose-400');
        return;
      }
      if (!message) {
        showToast('Escreva a mensagem do aviso.', 'bg-rose-950 text-rose-200 border-rose-400');
        return;
      }

      const targetLower = targetHandle.toLowerCase();
      const warningObj = {
        id: `warn_${Date.now()}`,
        from: state.handle,
        message,
        day: globalState.day
      };

      if (rtdb) {
        try {
          const snap = await rtdb.ref('colony_accounts/' + dbSafeKey(targetHandle)).get();
          if (snap.exists()) {
            accounts[targetLower] = ensureAccountFields(snap.val());
          }
        } catch (e) {}
      }

      let targetAcc = accounts[targetLower]
        ? ensureAccountFields(accounts[targetLower])
        : createDefaultAccountState(targetHandle, '0000');

      targetAcc.notifications.unshift(warningObj);
      saveAccountToCloud(targetAcc);

      if (targetLower === activeKey) {
        state = targetAcc;
      }

      if (handleInput) handleInput.value = '';
      if (msgInput) msgInput.value = '';
      renderApp();
      showToast(`Aviso enviado para ${targetHandle}!`);
    }

    function deletePersonByHandle(rawHandle) {
      if (!state || !adminUnlocked) return;
      const targetHandle = normalizeHandle(rawHandle);
      if (!targetHandle || targetHandle === '@') {
        showToast('Digite o @ da pessoa para deletar.', 'bg-rose-950 text-rose-200 border-rose-400');
        return;
      }

      const targetLower = targetHandle.toLowerCase();
      globalState.activeColonists = globalState.activeColonists.filter(
        col => normalizeHandle(col.handle).toLowerCase() !== targetLower
      );
      globalState.pendingFollowers = globalState.pendingFollowers.filter(
        col => normalizeHandle(col.handle).toLowerCase() !== targetLower
      );
      saveGlobalState();

      if (accounts[targetLower] && targetLower !== activeKey) {
        delete accounts[targetLower];
        localStorage.setItem(ACCOUNTS_STORAGE_KEY, JSON.stringify(accounts));
      }
      if (rtdb && targetLower !== activeKey) {
        rtdb.ref('colony_accounts/' + dbSafeKey(targetHandle)).remove();
      }

      renderApp();
      showToast(`${targetHandle} deletado com sucesso!`);
    }

        globalState.activeColonists.push({

          arrivedOnDay: globalState.day,

                       class="flex-1 px-3 py-2 rounded-xl border-2 border-[#090D16] text-xs font-bold bg-white"
                     />
                     <button type="button" onclick="unlockAdminPanel()" class="btn-cosmic-sm px-3.5 py-2 rounded-xl bg-[#84CC16] text-[#090D16] text-xs font-black shrink-0">
                       Liberar
                     </button>
                   </div>
                 </div>`
              : `<div class="space-y-3">
                   <button type="button" onclick="advanceOneHourByAdmin()" class="btn-cosmic-sm w-full py-2 rounded-xl bg-[#38BDF8] text-[#090D16] text-xs font-black">
                     Avançar 1 Hora (Alternar Missão)
                   </button>

                   <div class="pt-2 border-t border-slate-300 space-y-2">
                     <label for="follower-handle-input" class="block text-xs font-black text-slate-900">
                       Registrar seguidor (@):
                     </label>
                     <div class="flex gap-2">
                       <input
                         id="follower-handle-input"
                         type="text"
                         placeholder="@do_seguidor"
                         onkeydown="if (event.key === 'Enter') { event.preventDefault(); addFollowerByAdmin(); }"
                         class="flex-1 px-3 py-2 rounded-xl border-2 border-[#090D16] text-xs font-bold bg-white"
                       />
                       <button type="button" onclick="addFollowerByAdmin()" class="btn-cosmic-sm px-3 py-2 rounded-xl bg-[#A855F7] text-white text-xs font-black shrink-0">
                         Adicionar
                       </button>
                     </div>
                   </div>

                   <div class="pt-2 border-t border-slate-300 space-y-2">
                     <label for="warning-handle-input" class="block text-xs font-black text-slate-900">
                       Mandar um aviso (nome da base errado):
                     </label>
                     <input
                       id="warning-handle-input"
                       type="text"
                       placeholder="@da_pessoa"
                       class="w-full px-3 py-2 rounded-xl border-2 border-[#090D16] text-xs font-bold bg-white"
                     />
                     <textarea
                       id="warning-message-input"
                       rows="2"
                       placeholder="Escreva o aviso sobre o nome da base..."
                       class="w-full px-3 py-2 rounded-xl border-2 border-[#090D16] text-xs font-bold bg-white"
                     ></textarea>
                     <button type="button" onclick="sendWarningToHandle()" class="btn-cosmic-sm w-full py-2 rounded-xl bg-amber-400 text-[#090D16] text-xs font-black">
                       Mandar um aviso
                     </button>
                   </div>

                   <div class="pt-2 border-t border-slate-300 space-y-2">
                     <label for="delete-handle-input" class="block text-xs font-black text-slate-900">
                       Deletar conta/carteira por @:
                     </label>
                     <div class="flex gap-2">
                       <input
                         id="delete-handle-input"
                         type="text"
                         placeholder="@da_pessoa"
                         onkeydown="if (event.key === 'Enter') { event.preventDefault(); deleteFollowerByAdminInput(); }"
                         class="flex-1 px-3 py-2 rounded-xl border-2 border-[#090D16] text-xs font-bold bg-white"
                       />
                       <button type="button" onclick="deleteFollowerByAdminInput()" class="btn-cosmic-sm px-3 py-2 rounded-xl bg-rose-600 text-white text-xs font-black shrink-0">
                         Deletar
                       </button>
                     </div>
                   </div>

                   <div class="pt-2 border-t border-slate-300 space-y-1.5">
                     <div class="text-xs font-black text-slate-900">
                       Motivos enviados ao deletar dados (${reasonsList.length}):
                     </div>
                     ${reasonsList.length === 0
                       ? `<p class="text-[11px] font-bold text-slate-600">Nenhum motivo recebido ainda.</p>`
                       : `<div class="space-y-1.5 max-h-36 overflow-y-auto">
                            ${reasonsList.map(item => `
                              <div class="p-2 rounded-xl bg-rose-50 border border-rose-300 text-[11px]">
                                <span class="font-black text-rose-900">${esc(item.handle)} (Dia ${item.day}):</span>
                                <span class="font-bold text-slate-800"> ${esc(item.reason)}</span>
                              </div>
                            `).join('')}
                          </div>`
                     }
                   </div>

                   <div class="text-xs font-extrabold text-slate-800 bg-slate-200/80 rounded-xl p-2.5">
                     Pendentes para amanhã: <span class="text-purple-700">${globalState.pendingFollowers.length}</span>
                   </div>

                   <button type="button" onclick="advanceToNextDay()" class="btn-cosmic w-full py-2.5 rounded-2xl bg-[#84CC16] text-[#090D16] text-xs font-black">
                     Avançar para o Dia ${globalState.day + 1}
                   </button>
                 </div>`
            }
          </div>
        </div>
      `;
    }

    function renderPasse() {
      return `
        <div class="p-4 space-y-4 tab-content">
          <div class="orbit-card p-4 space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="font-display text-lg font-bold">Carteira do Usuário</h2>
              <span class="px-2.5 py-1 rounded-full bg-[#0F172A] text-[#A3E635] text-xs font-black">
                ${esc(state.handle)}
              </span>
            </div>

            <div class="p-3 rounded-2xl bg-[#0F172A] text-white border-2 border-[#090D16]">
              ${renderCharacterWithPetSVG(state.look.species, state.look.suit, state.look.accessory, state.look.pet, 'h-24')}
              <div class="mt-2 text-xs font-black text-[#A3E635] text-center">
                Base: ${esc(state.profile.base)} • Planeta: ${esc(state.profile.planet)} • Profissão: ${esc(state.profile.profession)}
              </div>
            </div>

            <div class="space-y-1.5">
              <label for="profile-base-input" class="block text-xs font-black text-slate-900">
                Base:
              </label>
              <div class="flex gap-2">
                <input
                  id="profile-base-input"
                  type="text"
                  value="${esc(state.profile.base)}"
                  onkeydown="if (event.key === 'Enter') { event.preventDefault(); updateProfileBaseFromButton(); }"
                  placeholder="Ex: base alien formador de aura"
                  class="flex-1 px-3 py-2 rounded-xl border-2 border-[#090D16] text-xs font-bold bg-white"
                />
                <button type="button" onclick="updateProfileBaseFromButton()" class="btn-cosmic-sm px-3 py-2 rounded-xl bg-[#84CC16] text-[#090D16] text-xs font-black shrink-0">
                  Atualizar
                </button>
              </div>
            </div>

            <div>
              <div class="text-xs font-black text-slate-900 mb-1.5">Planeta:</div>
              <div class="flex flex-wrap gap-1.5">
                ${PLANETS.map(planet => `
                  <button type="button" onclick="selectProfilePlanet('${planet}')" class="btn-cosmic-sm px-3 py-1.5 rounded-xl text-xs ${state.profile.planet === planet ? 'bg-[#84CC16] text-[#090D16]' : 'bg-white text-slate-800'}">
                    ${planet}
                  </button>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="text-xs font-black text-slate-900 mb-1.5">Profissão:</div>
              <div class="flex flex-wrap gap-1.5">
                ${PROFESSIONS.map(prof => `
                  <button type="button" onclick="selectProfileProfession('${prof}')" class="btn-cosmic-sm px-2.5 py-1.5 rounded-xl text-xs ${state.profile.profession === prof ? 'bg-[#38BDF8] text-[#090D16]' : 'bg-white text-slate-800'}">
                    ${prof}
                  </button>
                `).join('')}
              </div>
            </div>

            <button type="button" onclick="openDeleteReasonModal()" class="btn-cosmic-sm w-full py-2 rounded-xl bg-rose-600 text-white text-xs font-black mt-2">
              Deletar apenas meus dados (${esc(state.handle)})
            </button>
          </div>

          <div class="orbit-card p-4 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <h3 class="font-display text-base font-bold">Colonos & Carteiras (Dia ${globalState.day})</h3>
              ${adminUnlocked
                ? `<span class="text-[11px] font-black text-rose-700">Toque para deletar</span>`
                : `<span class="text-[11px] font-bold text-slate-500">Toque para ver</span>`
              }
            </div>
            ${globalState.activeColonists.length === 0
              ? `<p class="text-xs font-bold text-slate-600">Nenhum colono registrado ainda.</p>`
              : `<div class="space-y-2.5">
                   ${globalState.activeColonists.map((col, idx) => `
                     <button type="button" onclick="openWalletModal(${idx})" class="w-full text-left p-3 rounded-2xl bg-[#0F172A] text-white border-2 border-[#090D16] flex items-center justify-between gap-2 active:scale-[0.99] transition">
                       <div>
                         <div class="text-xs font-black text-[#A3E635]">COLONO #${idx + 1} • CÚPULA ${esc(col.dome)}</div>
                         <div class="text-sm font-black mt-0.5">${esc(col.handle)}</div>
                         <div class="text-[11px] text-slate-300 font-bold">Planeta ${esc(col.planet || 'Lua')} • ${esc(col.base || 'Base Alfa-01')}</div>
                       </div>
                       ${renderCharacterWithPetSVG(col.species, col.suit, 'nenhum', 'nenhum', 'h-14')}
                     </button>
                   `).join('')}
                 </div>`
            }
          </div>
        </div>
      `;
    }

    function getResidentsForPlanet(planet) {
      const mapByHandle = new Map();

      Object.values(accounts).forEach(acc => {
        if (!acc || !acc.handle) return;
        const p = (acc.profile && acc.profile.planet) || 'Lua';
        if (p === planet) {
          mapByHandle.set(acc.handle.toLowerCase(), {
            handle: acc.handle,
            base: (acc.profile && acc.profile.base) || 'Base Alfa-01',
            planet: p,
            profession: (acc.profile && acc.profile.profession) || 'Morador',
            species: (acc.look && acc.look.species) || 'creme',
            suit: (acc.look && acc.look.suit) || 'cor_branca'
          });
        }
      });

      globalState.activeColonists.forEach(col => {
        if (!col || !col.handle) return;
        const key = col.handle.toLowerCase();
        const p = col.planet || 'Lua';
        if (p === planet && !mapByHandle.has(key)) {
          mapByHandle.set(key, {
            handle: col.handle,
            base: col.base || 'Base Alfa-01',
            planet: p,
            profession: 'Morador',
            species: col.species || 'creme',
            suit: col.suit || 'cor_branca'
          });
        }
      });

      return Array.from(mapByHandle.values());
    }

    function renderMapa() {
      const planetThemes = {
        'Lua': {
          title: 'Mini Mapa da Lua',
          bg: 'from-[#1E293B] via-[#334155] to-[#475569]',
          ground: '#94A3B8',
          crater: '#64748B',
          dome: '#38BDF8',
          badge: 'bg-slate-200 text-slate-950'
        },
        'Marte': {
          title: 'Mini Mapa de Marte',
          bg: 'from-[#450A0A] via-[#7C2D12] to-[#9A3412]',
          ground: '#EA580C',
          crater: '#9A3412',
          dome: '#FACC15',
          badge: 'bg-orange-200 text-orange-950'
        },
        'Júpiter': {
          title: 'Mini Mapa de Júpiter',
          bg: 'from-[#422006] via-[#854D0E] to-[#A16207]',
          ground: '#EAB308',
          crater: '#A16207',
          dome: '#A855F7',
          badge: 'bg-amber-200 text-amber-950'
        }
      };

      const theme = planetThemes[selectedMapPlanet] || planetThemes['Lua'];
      const residents = getResidentsForPlanet(selectedMapPlanet);

      return `
        <div class="p-4 space-y-4 tab-content">
          <div class="orbit-card p-4 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <h2 class="font-display text-lg font-bold">Mapa Estelar</h2>
              <span class="px-2.5 py-1 rounded-full ${theme.badge} text-[11px] font-black">
                ${residents.length} morador(es)
              </span>
            </div>

            <div class="grid grid-cols-3 gap-2">
              ${PLANETS.map(planet => `
                <button
                  type="button"
                  onclick="selectMapPlanet('${planet}')"
                  class="btn-cosmic-sm py-2 rounded-2xl text-xs font-black ${selectedMapPlanet === planet ? 'bg-[#84CC16] text-[#090D16]' : 'bg-white text-slate-800'}"
                >
                  ${planet}
                </button>
              `).join('')}
            </div>

            <!-- MINI MAPA VISUAL DO PLANETA -->
            <div class="rounded-3xl bg-gradient-to-b ${theme.bg} border-[3px] border-[#090D16] p-3 text-white relative overflow-hidden">
              <div class="flex items-center justify-between mb-2">
                <span class="font-display text-sm font-bold">${theme.title}</span>
                <span class="text-[10px] font-black px-2 py-0.5 rounded-full bg-black/40">
                  Setor ${selectedMapPlanet}
                </span>
              </div>

              <!-- Terreno / Superfície do Mini Mapa com Bases e Nomes em Cima -->
              <div class="relative rounded-2xl border-2 border-black/40 p-3 min-h-[165px] flex flex-wrap items-end justify-center gap-3" style="background-color: ${theme.ground};">
                <div class="absolute top-3 left-4 w-7 h-3 rounded-full opacity-40" style="background-color: ${theme.crater};"></div>
                <div class="absolute top-7 right-6 w-10 h-4 rounded-full opacity-40" style="background-color: ${theme.crater};"></div>

                ${residents.length === 0
                  ? `<div class="my-auto text-center bg-black/65 px-3 py-2 rounded-2xl text-xs font-extrabold text-white">
                       Nenhuma base construída em ${selectedMapPlanet} ainda.
                     </div>`
                  : residents.map(res => {
                      const cleanName = res.handle.replace(/^@/, '');
                      return `
                        <div class="relative z-10 flex flex-col items-center bg-black/45 px-2.5 py-2 rounded-2xl border border-white/25 max-w-[135px]">
                          <div class="px-2 py-0.5 rounded-full bg-[#090D16] text-[#A3E635] text-[10px] font-black border border-[#A3E635] mb-1 truncate max-w-full">
                            ${esc(cleanName)}
                          </div>
                          <!-- Ícone de Base / Cúpula -->
                          <svg viewBox="0 0 64 44" class="w-14 h-10">
                            <path d="M12 34 A20 20 0 0 1 52 34 Z" fill="${theme.dome}" stroke="#090D16" stroke-width="3"/>
                            <rect x="8" y="33" width="48" height="7" rx="3" fill="#0F172A" stroke="#090D16" stroke-width="2.5"/>
                            <rect x="27" y="24" width="10" height="10" rx="2" fill="#F8FAFC" stroke="#090D16" stroke-width="2"/>
                          </svg>
                          <div class="text-[10px] font-black text-white text-center leading-tight mt-0.5 truncate max-w-full">
                            ${esc(res.base)}
                          </div>
                        </div>
                      `;
                    }).join('')
                }
              </div>
            </div>

            <!-- LISTA DETALHADA DOS MORADORES DO PLANETA SELECIONADO -->
            <div class="space-y-2 pt-1">
              <h3 class="font-display text-sm font-bold text-slate-900">
                Quem mora em ${selectedMapPlanet}:
              </h3>
              ${residents.length === 0
                ? `<p class="text-xs font-bold text-slate-600">Ninguém morando em ${selectedMapPlanet} no momento.</p>`
                : residents.map(res => `
                    <div class="p-2.5 rounded-2xl bg-slate-100 border-2 border-[#090D16] flex items-center justify-between gap-2">
                      <div>
                        <div class="text-xs font-black text-slate-950">${esc(res.handle)}</div>
                        <div class="text-[11px] font-bold text-slate-700">
                          Base: <span class="font-black">${esc(res.base)}</span> • ${esc(res.profession)}
                        </div>
                      </div>
                      ${renderCharacterWithPetSVG(res.species, res.suit, 'nenhum', 'nenhum', 'h-12')}
                    </div>
                  `).join('')
              }
            </div>
          </div>
        </div>
      `;
    }

    function renderAvisos() {
      const items = state.notifications || [];
      return `
        <div class="p-4 space-y-4 tab-content">
          <div class="orbit-card p-4 space-y-3">
            <h2 class="font-display text-lg font-bold">Notificações / Avisos</h2>
            ${items.length === 0
              ? `<p class="text-xs font-bold text-slate-600">Nenhum aviso recebido ainda.</p>`
              : `<div class="space-y-2.5">
                   ${items.map(item => `
                     <div class="p-3 rounded-2xl bg-amber-100 border-2 border-[#090D16] space-y-1">
                       <div class="text-[11px] font-black text-amber-900">
                         Aviso do Criador (${esc(item.from)}) • Dia ${item.day}
                       </div>
                       <div class="text-xs font-extrabold text-slate-950">
                         ${esc(item.message)}
                       </div>
                     </div>
                   `).join('')}
                 </div>`
            }
          </div>
        </div>
      `;
    }

    function renderApp() {
      if (!state) return;
      syncMissionTimer();
      updateHeaderAndNav();
      const main = document.getElementById('app-main');
      const views = {
        inicio: renderInicio,
        loja: renderLoja,
        missoes: renderMissoes,
        codigos: renderCodigos,
        passe: renderPasse,
        mapa: renderMapa,
        bases: renderMapa,
        avisos: renderAvisos
      };
      const fn = views[state.activeTab] || renderInicio;
      main.innerHTML = fn();
    }

    setInterval(() => {
      if (state && state.missionCooldownUntil) {
        const prevSlot = state.missionSlot;
        const hadTimer = Boolean(state.missionCooldownUntil);
        syncMissionTimer();
        if (state.activeTab === 'missoes' && (hadTimer !== Boolean(state.missionCooldownUntil) || prevSlot !== state.missionSlot)) {
          renderApp();
        }
      }
    }, 1000);

    if (state) {
      document.getElementById('login-screen').classList.add('hidden');
      renderApp();
    } else {
      document.getElementById('login-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
